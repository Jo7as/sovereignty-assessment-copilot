slug: ovhcloud
name: OVHcloud
provider: ovh
category: cloud-infrastructure
description: Cloud-Infrastruktur mit Rechenleistung, Speicher und dedizierten Servern
typical_criticality: HOCH

aliases:
  - OVH
  - OVH Cloud
  - OVHcloud Public Cloud

variants:
  - slug: standard
    name: Standard
    default: true

    # Der Kunde wählt den Standort. Es gibt auch Rechenzentren außerhalb der EU.
    data_location:
      value: EU_WAEHLBAR
      source: https://www.ovhcloud.com/de/about-us/global-infrastructure/
      quote: "können Sie frei entscheiden, wo Sie Ihre Daten speichern und Ihre Anwendungen entwickeln möchten"
      retrieved: 2026-10-13

    certificates:
      - certificate: iso-27001
        source: https://www.ovhcloud.com/de/compliance/
        quote: "Zertifizierung und ISMS für das Informationssicherheitsmanagement für Cloud-Dienste nach ISO/IEC 27001:2013"
        retrieved: 2026-10-13

    openness:
      value: OFFENE_STANDARDS
      source: https://docs.ovhcloud.com/en/guides/account-and-service-management/reversibility/global-reversibility-policy
      quote: "an open, standard environment, in which our customers have very broad control over their systems and data"
      retrieved: 2026-10-14

    # Offene Standardumgebung mit voller Kontrolle über Systeme und Daten. Zusätzlich verpflichtet
    # sich OVHcloud auf den SWIPO-Verhaltenskodex für Wechsel und Datenübertragung
    data_export:
      value: OFFENE_FORMATE
      source: https://docs.ovhcloud.com/en/guides/account-and-service-management/reversibility/global-reversibility-policy
      quote: "an open, standard environment, in which our customers have very broad control over their systems and data"
      retrieved: 2026-10-14

    review:
