slug: 1password
name: 1Password Business
provider: agilebits
category: security
description: Passwortverwaltung für Teams und Unternehmen
typical_criticality: MITTEL

variants:
  - slug: standard
    name: Standard
    default: true

    # Regionen 1Password.com (USA), 1Password.ca (Kanada) und 1Password.eu (EU)
    data_location:
      value: EU_WAEHLBAR
      source: https://support.1password.com/regions/
      quote: "You can choose where your data is hosted and which currency you pay in."
      retrieved: 2026-11-08

    # Ende-zu-Ende-Verschlüsselung: Kontopasswort und Secret Key bleiben auf den Geräten des Kunden
    key_management:
      value: KUNDE_EXTERN
      source: https://1password.com/security
      quote: "One of these principles is that only you should have the keys required to decrypt your data."
      retrieved: 2026-11-08

    certificates:
      - certificate: soc-2-type-2
        source: https://1password.com/security
        quote: "1Password is SOC 2 type 2 certified"
        retrieved: 2026-11-08

    review:
      status: KI_NACHGEPRUEFT
      date: 2026-11-08

# Der Migrationsaufwand ist eine Einschätzung, keine belegte Angabe.
alternatives:
  - service: passbolt
    effort: GERING
    note: Export und Import der Passwörter, Schulung der Teams
