# Hosts, die eine Website einbindet. path grenzt Dienste vom selben Host ab.
# Noch ohne prüfbare Fundstelle und deshalb nicht aufgenommen: Hotjar, TrustArc, Usercentrics,
# Pardot, 6sense, Terminus, Vimeo, Matomo Cloud. Ihre Seiten sperren
# automatische Abrufe oder laden den Text erst per Javascript.
web:
  - service: google-analytics
    host: googletagmanager.com
    path: /gtag/js
    strength: NUTZUNG
    meaning: Die Website lädt das Google-Tag für Google Analytics
    source: https://developers.google.com/tag-platform/gtagjs/install
    quote: '<script async src="https://www.googletagmanager.com/gtag/js?id='
    retrieved: 2026-10-21
  - service: google-tag-manager
    host: googletagmanager.com
    path: /gtm.js
    strength: NUTZUNG
    meaning: Die Website lädt den Google Tag Manager
    source: https://developers.google.com/tag-platform/tag-manager/datalayer
    quote: "j.src= 'https://www.googletagmanager.com/gtm.js?id='"
    retrieved: 2026-10-21
  - service: microsoft-clarity
    host: clarity.ms
    strength: NUTZUNG
    meaning: Die Website lädt Microsoft Clarity
    source: https://learn.microsoft.com/en-us/clarity/setup-and-installation/clarity-csp
    quote: "default-src 'self' https://*.clarity.ms https://c.bing.com 'unsafe-inline';"
    retrieved: 2026-10-21
  - service: etracker-analytics
    host: code.etracker.com
    strength: NUTZUNG
    meaning: Die Website lädt den Tracking-Code von etracker
    source: https://www.etracker.com/docs/integration-setup/tracking-code-sdks/tracking-code-integration/
    quote: 'src="//code.etracker.com/code/e.js"'
    retrieved: 2026-10-21
  - service: youtube
    host: youtube.com
    path: /embed
    strength: NUTZUNG
    meaning: Die Website bettet Videos von YouTube ein
    source: https://developers.google.com/youtube/player_parameters
    quote: "The <iframe> tag method uses a src URL format of https://www.youtube.com/embed/VIDEO_ID"
    retrieved: 2026-10-21
  - service: google-fonts
    host: fonts.googleapis.com
    strength: NUTZUNG
    meaning: Die Website lädt Schriften von Google
    source: https://developers.google.com/fonts/docs/getting_started
    quote: '<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">'
    retrieved: 2026-10-21
  - service: recaptcha
    host: google.com
    path: /recaptcha
    strength: NUTZUNG
    meaning: Die Website lädt reCAPTCHA von Google
    source: https://developers.google.com/recaptcha/docs/display
    quote: '<script src="https://www.google.com/recaptcha/api.js" async defer></script>'
    retrieved: 2026-10-21

  - service: linkedin-insight-tag
    host: snap.licdn.com
    strength: NUTZUNG
    meaning: Die Website lädt das LinkedIn Insight Tag
    source: https://www.linkedin.com/help/lms/answer/a425696
    quote: "make sure that you’re not blocking these domains: snap.licdn.com px.ads.linkedin.com"
    retrieved: 2026-10-22
  - service: linkedin-insight-tag
    host: px.ads.linkedin.com
    strength: NUTZUNG
    meaning: Die Website sendet Daten an das LinkedIn Insight Tag
    source: https://www.linkedin.com/help/lms/answer/a425696
    quote: "make sure that you’re not blocking these domains: snap.licdn.com px.ads.linkedin.com"
    retrieved: 2026-10-22
  - service: onetrust
    host: cdn.cookielaw.org
    strength: NUTZUNG
    meaning: Die Website lädt den Cookie-Banner von OneTrust
    source: https://developer.onetrust.com/onetrust/docs/configure-sdk-parameters-new
    quote: "The CDN location for the JSON that the SDK fetches. (Usually, but not always, cdn.cookielaw.org)."
    retrieved: 2026-10-22
  - service: cloudflare
    host: cdnjs.cloudflare.com
    path: /ajax/libs
    strength: HINWEIS
    meaning: Die Website lädt Bibliotheken über cdnjs, ein öffentliches CDN von Cloudflare
    source: https://cdnjs.com/libraries/docsify/4.5.4
    quote: "https://cdnjs.cloudflare.com/ajax/libs/docsify/4.5.4/docsify.min.js"
    retrieved: 2026-10-22
  # Die folgenden Seiten sperren automatische Abrufe. Die Fundstellen hat ein Mensch im
  # Browser geprüft (verified_by), verify_evidence.py zählt sie gesondert.
  - service: meta-pixel
    host: connect.facebook.net
    strength: NUTZUNG
    meaning: Die Website lädt das Meta-Pixel
    source: https://developers.facebook.com/documentation/meta-pixel/get-started
    quote: "'https://connect.facebook.net/en_US/fbevents.js');"
    retrieved: 2026-10-22
    verified_by: Jonas Hülzer, im Browser geprüft (Bildschirmfoto)
  - service: meta-pixel
    host: facebook.com
    path: /tr
    strength: NUTZUNG
    meaning: Die Website sendet Daten an das Meta-Pixel
    source: https://developers.facebook.com/documentation/meta-pixel/get-started
    quote: 'src="https://www.facebook.com/tr?id={your-pixel-id-goes-here}&ev=PageView&noscript=1"'
    retrieved: 2026-10-22
    verified_by: Jonas Hülzer, im Browser geprüft (Bildschirmfoto)
  - service: cookiebot
    host: consent.cookiebot.com
    strength: NUTZUNG
    meaning: Die Website lädt den Cookie-Banner von Cookiebot
    source: https://www.cookiebot.com/en/manual-implementation/
    quote: '<script id="Cookiebot" src="https://consent.cookiebot.com/uc.js"'
    retrieved: 2026-10-22
    verified_by: Jonas Hülzer, im Browser geprüft (Bildschirmfoto)

# Kennungen im Code der Website oder im Container des Google Tag Managers.
ids:
  - service: google-analytics
    pattern: "\\bG-(?=[A-Z0-9]*[0-9])[A-Z0-9]{8,12}\\b"
    strength: NUTZUNG
    meaning: Die Website enthält eine Mess-ID von Google Analytics
    source: https://support.google.com/analytics/answer/12270356?hl=en
    quote: "The format of a measurement ID in Google Analytics is 'G-' followed by a combination of numbers and letters"
    retrieved: 2026-10-22
  - service: google-ads
    pattern: "\\bAW-[0-9]{6,12}\\b"
    strength: NUTZUNG
    meaning: Die Website enthält eine Conversion-ID von Google Ads
    source: https://developers.google.com/tag-platform/devguides/conversions
    quote: "The Ads event snippet uses gtag('event', 'conversion', ...) to mark an event as a conversion."
    retrieved: 2026-10-22
