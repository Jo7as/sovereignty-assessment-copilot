# Musterbank AG: fiktive Privatbank, Frankfurt am Main, rund 450 Mitarbeitende.
# Firmen- und Privatkunden, beaufsichtigt durch die BaFin, damit DORA-pflichtig.
#
# Alle Angaben sind erfunden, Vertragsreferenzen und Daten ebenso. Die Einträge sind
# absichtlich so geschrieben, wie eine Bank sie führt: mit Abkürzungen, Produktnamen und
# einem Tippfehler (Nr. 19).
