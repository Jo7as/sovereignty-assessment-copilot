# "erwartet" ist der Dienst, der tatsächlich gemeint ist (slug), oder null bei Eigenentwicklungen
# ohne Marktangebot. Das Feld fließt nicht in die Excel-Datei ein, sondern dient als Lösung, an
# der die automatische Zuordnung (Schritt 2.4) gemessen wird.
