# Testverträge für die Vertragsanalyse (PLAN.md 9.2, docs/tiefenpruefung-ablauf.md Abschnitt 9)
#
# Öffentliche Auftragsverarbeitungsverträge, direkt vom Hersteller. Die PDFs liegen nicht im
# Repository (Urheberrecht der Hersteller), das Skript lädt sie:
#   cd backend && uv run python scripts/fetch_contracts.py
# Sie landen in data/testdata/contracts/pdf/ (von git ignoriert). Die Prüfsumme stellt sicher,
# dass die Musterlösung zur selben Fassung gehört. Ändert ein Hersteller das Dokument, meldet
# das Skript eine Abweichung, und die Musterlösung muss neu geprüft werden.
#
# Nicht aufgenommen (Stand 9.11.2026):
# - Microsoft Products and Services DPA: nur als Word-Datei veröffentlicht, Seitenangaben
#   wären von der Umwandlung abhängig
# - Personio DPA: automatischer Abruf gesperrt (403)
# - DATEV: Vertrag nur über ein Formular im Kundenkonto
# - IONOS: kein offizielles PDF auffindbar, nur Kopien Dritter

