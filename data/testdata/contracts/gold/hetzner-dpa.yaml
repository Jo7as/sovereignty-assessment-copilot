    note: "Widerspruch im Dokument: § 3 sagt EU/EWR ausschließlich zu, Anlage 3 nennt Unterauftragnehmer in den USA und Singapur und beschränkt die Zusage auf gewählte EU-Standorte. Richtiges Verhalten des Ablaufs: UNKLAR an den Berater. Beide Werte gelten hier als richtig."
