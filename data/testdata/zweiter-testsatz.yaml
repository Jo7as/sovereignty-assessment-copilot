# Zweiter Testsatz für die Zuordnung, geschrieben wie Einträge im IT-Bestand einer Bank.
#
# Verfasst von Claude am 19.10.2026 im Auftrag von Jonas, weil kein Testsatz von einer
# Person ohne Kenntnis der Datenbank vorliegt. Er ist deshalb NICHT unabhängig im
# strengen Sinn. Zur Absicherung:
# - Die Einträge nutzen Produkt- und Modulnamen aus der Praxis, die nicht als Schreibweise
#   in der Datenbank stehen, und enthalten Fallen (etwa SAP Ariba, das nicht S/4HANA ist).
# - Rund ein Viertel der Einträge betrifft Dienste, die nicht in der Datenbank stehen.
# - Die erwartete Lösung wurde festgelegt und committet, BEVOR die Zuordnung lief.
#   Die Reihenfolge der Commits in Git belegt das.
# - Für diesen Test wurde an der Datenbank nichts geändert.
#
# "erwartet" ist der gemeinte Dienst (slug) oder null, wenn er nicht in der Datenbank steht.

