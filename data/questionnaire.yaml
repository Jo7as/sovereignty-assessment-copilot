# Fragebogen für das Assessment (Nutzungsstufe 2)
#
# Der Fragebogen erfasst, was die Anbieterdatenbank nicht wissen kann: wer das Unternehmen
# ist und wie es seine Abhängigkeit von IT-Anbietern steuert.
#
# - Die Fragen im Abschnitt „profil“ bestimmen, ob DORA oder NIS2 gilt. Sie fließen in
#   keinen Reifegrad ein.
# - Alle anderen Fragen ergeben einen Reifegrad 0 bis 4 je Handlungsfeld (dimensions).
#   Er steht neben den SEAL-Stufen der Anbieter und verändert sie nicht: Ein Anbieter wird
#   nicht souveräner, weil das Unternehmen einen Exit-Plan hat.
# - „Weiß nicht“ zählt wie „Nein“. Das entspricht der Bewertung der Anbieter, bei der eine
#   fehlende Angabe als ungünstigster Fall gilt.
# - Jede Rechtsgrundlage (basis) zitiert den amtlichen deutschen Text wörtlich. Das Skript
#   backend/scripts/verify_evidence.py ruft die Quelle ab und sucht die Fundstelle.
#   Fragen ohne basis beruhen auf der Methodik des Tools, nicht auf einer Rechtspflicht.

